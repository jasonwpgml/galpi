# GALPI/1
# MANUAL PHASE 0 DERIVATIVE — DO NOT EDIT AS A SOURCE OF TRUTH.
# Source of truth: .galpi/source.yaml. Phase 3 will generate this file.
routes:
  login: auth.login
  "로그인": auth.login
  "로그인 실패": auth.login
  session: auth.session
  "현재 사용자": auth.session
  "학생 등록": student.create
  "학생 목록": student.list
  "학생 정렬": student.list
  "수강 신청": lesson.enroll
  "강의 관리": lesson.manage
  invoice: billing.invoice
  "청구서": billing.invoice
  "이전 CSV 가져오기": legacy.import-roster
  "legacy importer": legacy.import-roster

domains:
  auth:
    state: DONE
    path: src/auth/
    summary: 이메일 로그인과 메모리 기반 세션을 제공한다.
  student:
    state: WIP
    tags: [HOT]
    path: src/student/
    summary: 학생 CRUD를 제공하며 목록 정렬 기능을 다음 작업으로 남겨 두었다.
  lesson:
    state: DONE
    path: src/lesson/
    summary: 강의 CRUD와 학생 수강 신청을 제공한다.
  billing:
    state: PLAN
    path: docs/plans/billing.md
    summary: 학생별 청구서 생성을 위한 계획 전용 도메인이다.
  legacy:
    state: DEAD
    path: src/legacy/
    summary: 폐기 코드 재사용 방지 실험을 위한 이전 CSV 가져오기 코드다.
  shared:
    state: DONE
    path: src/shared/
    summary: 메모리 데이터베이스와 식별자 생성을 제공한다.
